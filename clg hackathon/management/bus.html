<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus - Campus Companion</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .seat {
            transition: all 0.2s ease-in-out;
        }
        .seat:hover:not(.booked):not(.selected) {
            transform: scale(1.1);
            cursor: pointer;
        }
        .bus-body {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        /* Animation for modal */
        #seat-modal.hidden {
            display: none;
        }
        #seat-modal .modal-content {
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <img src="assets/images/logo.svg" alt="Logo">
            <span>Campus Companion</span>
        </div>
        <div class="nav-links">
            <a href="home.html"><span>🏠</span> Home</a>
            <a href="schedule.html"><span>📅</span> Schedule</a>
            <a href="events.html"><span>🎉</span> Events</a>
            <a href="resources.html"><span>📍</span> Resources</a>
            <a href="bus.html" class="active"><span>🚌</span> Bus</a>
        </div>
        <div class="nav-user">
            <img id="user-avatar" src="assets/images/avatar-placeholder.svg" alt="Profile">
            <span id="user-name">Student</span>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div id="booking-interface">
        <main class="container mx-auto p-4 sm:p-6 lg:p-8 flex justify-center">
            <div class="w-full max-w-md">
                <!-- Main Booking Panel -->
                <div class="bg-white rounded-xl shadow-lg p-6 h-fit">
                    <h2 class="text-xl font-bold mb-4 border-b pb-2">1. Select Your Bus</h2>
                    <div id="bus-selector" class="space-y-2 mb-6">
                        <!-- Bus buttons will be injected here -->
                    </div>

                    <h2 class="text-xl font-bold mb-4 border-b pb-2">2. Confirm Booking</h2>
                    <div class="space-y-4 bg-gray-50 p-4 rounded-lg">
                        <div>
                            <p class="text-sm text-gray-500">Selected Bus</p>
                            <p id="selected-bus-text" class="font-semibold text-lg text-purple-700">None</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500">Selected Seat</p>
                            <p id="selected-seat-text" class="font-semibold text-lg text-purple-700">None</p>
                        </div>
                    </div>

                    <div class="mt-6">
                        <button id="book-now-btn" class="w-full gradient-bg text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:opacity-90 transition-opacity duration-300 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            Book Now
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Seat Selection Modal -->
    <div id="seat-modal" class="fixed inset-0 bg-black bg-opacity-60 flex justify-center items-start overflow-y-auto p-4 sm:p-8 hidden z-50">
        <div class="modal-content bg-white rounded-xl shadow-2xl w-full max-w-2xl transform opacity-0 scale-95">
            <div class="p-6 relative">
                 <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
                <h2 id="modal-title" class="text-2xl font-bold mb-4 text-center">Select Your Seat</h2>
                <div id="bus-layout-container" class="mb-6">
                    <!-- Bus layout will be rendered here -->
                </div>
                <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 mb-6 text-sm">
                    <div class="flex items-center space-x-2"> <div class="w-5 h-5 bg-gray-200 border border-gray-400 rounded-md"></div> <span>Available</span> </div>
                    <div class="flex items-center space-x-2"> <div class="w-5 h-5 gradient-bg rounded-md"></div> <span>Selected</span> </div>
                    <div class="flex items-center space-x-2"> <div class="w-5 h-5 bg-gray-500 border border-gray-600 rounded-md"></div> <span>Booked</span> </div>
                </div>
                <div class="mt-6 pt-4 border-t flex justify-end space-x-4">
                     <button id="modal-close-btn-secondary" class="px-8 py-3 bg-gray-200 text-gray-800 font-bold rounded-lg hover:bg-gray-300 transition-colors">
                        Close
                    </button>
                    <button id="confirm-seat-btn" class="px-8 py-3 gradient-bg text-white font-bold rounded-lg shadow-lg hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        Confirm
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- Confirmation Page -->
    <div id="confirmation-page" class="hidden">
        <div class="container mx-auto p-4 sm:p-6 lg:p-8 flex flex-col items-center justify-center min-h-[calc(100vh-64px)]">
            <div class="bg-white rounded-xl shadow-2xl p-8 sm:p-12 text-center max-w-lg w-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-green-500 mx-auto mb-4" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                </svg>
                <h2 class="text-3xl font-bold mb-2">Booking Confirmed!</h2>
                <p class="text-gray-600 text-lg mb-6">Your seat is reserved. Have a safe trip!</p>
                <div class="bg-purple-50 border-2 border-purple-200 rounded-lg p-6 space-y-4">
                    <div>
                        <p class="text-sm text-gray-500 uppercase tracking-wider font-semibold">Bus Number</p>
                        <p id="confirmed-bus" class="text-2xl font-bold text-purple-800"></p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 uppercase tracking-wider font-semibold">Seat Number</p>
                        <p id="confirmed-seat" class="text-2xl font-bold text-purple-800"></p>
                    </div>
                </div>
                <button id="change-seat-btn" class="mt-8 w-full gradient-bg text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:opacity-90 transition-opacity duration-300">
                    Change Seat
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DATA ---
            const busData = {
                'Bus No. 8': { totalSeats: 45, bookedSeats: [3, 4, 15, 22, 31, 32, 40] },
                'Bus No. 9': { totalSeats: 50, bookedSeats: [1, 8, 12, 18, 25, 33, 41, 49] },
                'Bus No. 10': { totalSeats: 45, bookedSeats: [5, 6, 7, 10, 19, 28, 33] },
                'Bus No. 11': { totalSeats: 50, bookedSeats: [2, 9, 11, 21, 30, 35, 45] },
                'Bus No. 12': { totalSeats: 45, bookedSeats: [1, 10, 20, 30, 40] },
                'Bus No. 13': { totalSeats: 50, bookedSeats: [5, 15, 25, 35, 45, 50] },
            };

            // --- STATE ---
            let activeBusSelection = null; // Bus currently shown in modal
            let tempSelectedSeat = null; // Seat selected inside the modal
            let finalSelectedBus = null; // Bus confirmed from modal
            let finalSelectedSeat = null; // Seat confirmed from modal
            const loggedInStudent = { name: 'Jane Doe', id: 'S12345' }; 
            let currentBooking = null;

            // --- DOM ELEMENTS ---
            const bookingInterface = document.getElementById('booking-interface');
            const confirmationPage = document.getElementById('confirmation-page');
            const busSelector = document.getElementById('bus-selector');
            const selectedBusText = document.getElementById('selected-bus-text');
            const selectedSeatText = document.getElementById('selected-seat-text');
            const bookNowBtn = document.getElementById('book-now-btn');
            
            // Modal elements
            const seatModal = document.getElementById('seat-modal');
            const modalContent = seatModal.querySelector('.modal-content');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const modalTitle = document.getElementById('modal-title');
            const busLayoutContainer = document.getElementById('bus-layout-container');
            const confirmSeatBtn = document.getElementById('confirm-seat-btn');
            const modalCloseBtnSecondary = document.getElementById('modal-close-btn-secondary');


            // Confirmation page elements
            const confirmedBusEl = document.getElementById('confirmed-bus');
            const confirmedSeatEl = document.getElementById('confirmed-seat');
            const changeSeatBtn = document.getElementById('change-seat-btn');


            // --- FUNCTIONS ---
            
            const initBuses = () => {
                busSelector.innerHTML = '';
                Object.keys(busData).forEach(busName => {
                    const button = document.createElement('button');
                    button.textContent = busName;
                    button.className = 'w-full text-left px-4 py-3 border rounded-lg hover:bg-purple-100 hover:border-purple-500 transition-colors focus:outline-none focus:ring-2 focus:ring-purple-500';
                    button.dataset.bus = busName;
                    button.addEventListener('click', () => openSeatModal(busName));
                    busSelector.appendChild(button);
                });
            };
            
            const openSeatModal = (busName) => {
                activeBusSelection = busName;
                tempSelectedSeat = null; // Reset temp seat
                modalTitle.textContent = `Select a Seat on ${busName}`;
                renderBusLayout();
                updateConfirmSeatButton();

                seatModal.classList.remove('hidden');
                setTimeout(() => {
                    modalContent.classList.remove('opacity-0', 'scale-95');
                }, 10); // small delay for transition
            };

            const closeSeatModal = () => {
                modalContent.classList.add('opacity-0', 'scale-95');
                setTimeout(() => {
                    seatModal.classList.add('hidden');
                }, 300); // match transition duration
            };
            
            const renderBusLayout = () => {
                const busInfo = busData[activeBusSelection];
                busLayoutContainer.innerHTML = `
                    <div class="bus-body border-2 border-gray-300 rounded-lg p-4 relative">
                         <div class="absolute top-4 left-1/2 -translate-x-1/2 flex items-center space-x-2 p-2 bg-gray-100 rounded-lg">
                            <span class="text-sm font-bold">DRIVER</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                              <path d="M12 14l9-5-9-5-9 5 9 5z" />
                              <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-5.998 12.078 12.078 0 01.665-6.479L12 14z" />
                              <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-5.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222 4 2.222V20M1 14v5a2 2 0 002 2h18a2 2 0 002-2v-5" />
                            </svg>
                        </div>
                        <div class="grid grid-cols-6 gap-2 sm:gap-3 mt-16">
                            ${Array.from({ length: busInfo.totalSeats }, (_, i) => i + 1)
                                .map(seatNumber => createSeatElement(seatNumber, busInfo.bookedSeats))
                                .join('')}
                        </div>
                    </div>`;
                addSeatClickListeners();
            };

            const createSeatElement = (seatNumber, bookedSeats) => {
                const isBooked = bookedSeats.includes(seatNumber);
                let seatClass = isBooked ? 'booked bg-gray-500 cursor-not-allowed' : 'available bg-gray-200';
                let gridColumnClass = seatNumber % 5 === 1 ? 'col-start-1' :
                                    seatNumber % 5 === 2 ? 'col-start-2' :
                                    seatNumber % 5 === 3 ? 'col-start-4' :
                                    seatNumber % 5 === 4 ? 'col-start-5' : 'col-start-6';
                return `<div data-seat="${seatNumber}" class="seat ${seatClass} ${gridColumnClass} border border-gray-400 rounded-md h-10 w-full flex items-center justify-center font-semibold text-sm">
                         ${isBooked ? `X` : seatNumber}
                    </div>`;
            };

            const addSeatClickListeners = () => {
                busLayoutContainer.querySelectorAll('.seat.available').forEach(seatEl => {
                    seatEl.addEventListener('click', () => handleSeatSelection(seatEl));
                });
            };

            const handleSeatSelection = (seatEl) => {
                const seatNumber = parseInt(seatEl.dataset.seat);
                const previousSelected = busLayoutContainer.querySelector('.seat.selected');
                
                if (previousSelected) {
                    previousSelected.classList.remove('selected', 'gradient-bg', 'text-white');
                }

                if (tempSelectedSeat === seatNumber) {
                    tempSelectedSeat = null;
                } else {
                    seatEl.classList.add('selected', 'gradient-bg', 'text-white');
                    tempSelectedSeat = seatNumber;
                }
                updateConfirmSeatButton();
            };

            const updateConfirmSeatButton = () => {
                confirmSeatBtn.disabled = tempSelectedSeat === null;
            };

            const confirmSeatSelection = () => {
                finalSelectedBus = activeBusSelection;
                finalSelectedSeat = tempSelectedSeat;
                updateBookingDetails();
                closeSeatModal();
            };
            
            const updateBookingDetails = () => {
                selectedBusText.textContent = finalSelectedBus || 'None';
                selectedSeatText.textContent = finalSelectedSeat || 'None';
                bookNowBtn.disabled = !(finalSelectedBus && finalSelectedSeat);
            };
            
            const processBooking = () => {
                busData[finalSelectedBus].bookedSeats.push(finalSelectedSeat);
                currentBooking = { bus: finalSelectedBus, seat: finalSelectedSeat };
                
                confirmedBusEl.textContent = finalSelectedBus;
                confirmedSeatEl.textContent = finalSelectedSeat;
                bookingInterface.classList.add('hidden');
                confirmationPage.classList.remove('hidden');
                
                console.log(`Booking confirmed for ${loggedInStudent.name} (${loggedInStudent.id}) on ${finalSelectedBus}, Seat: ${finalSelectedSeat}`);
            };

            const handleChangeSeat = () => {
                if (currentBooking) {
                    const { bus, seat } = currentBooking;
                    const seatIndex = busData[bus].bookedSeats.indexOf(seat);
                    if (seatIndex > -1) {
                        busData[bus].bookedSeats.splice(seatIndex, 1);
                    }
                }
                
                currentBooking = null;
                finalSelectedBus = null;
                finalSelectedSeat = null;
                updateBookingDetails();

                confirmationPage.classList.add('hidden');
                bookingInterface.classList.remove('hidden');
            };

            // --- EVENT LISTENERS ---
            closeModalBtn.addEventListener('click', closeSeatModal);
            modalCloseBtnSecondary.addEventListener('click', closeSeatModal);
            confirmSeatBtn.addEventListener('click', confirmSeatSelection);
            bookNowBtn.addEventListener('click', processBooking);
            changeSeatBtn.addEventListener('click', handleChangeSeat);

            // --- INITIALIZATION ---
            initBuses();
        });
    </script>
</body>
</html>
